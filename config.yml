Task : GDSR
Version: SUN_v10_full_true_MIX2
train_target: SUN #TOFDC, NYUDC, DIML, SUN
network :
  in_dim : 1
  feature_dim : 16
  y_dim : 3
  depth : 6
  ratio_spatial : 32
  ratio_freq : 2
  ratio_fusion : 1
  control_nums : 4
  middle_blk_num : 4
  enc_blk_nums : [1,2]
  dec_blk_nums : [2,1]
  u_transform: True


datasets :
  train :
    path: "/mnt/disk1/wangyutong/datasets/SUNRGBD"
    patch_size : 256
    batch_size : 4
    aug_mode : True
    use_shuffle: true

  test :
    TOFDC: "/mnt/disk1/wangyutong/datasets/TOFDC/TOFDC_split"
    NYU_MA: "/mnt/disk1/wangyutong/datasets/NYU_MA"
    NYUDC: "/mnt/disk1/wangyutong/datasets/NYUDC"
    DIML: "/mnt/disk1/wangyutong/datasets/DIML"
    SUN: "/mnt/disk1/wangyutong/datasets/SUNRGBD"
scale : 1

train :
  epoch : 1000
  clip_grad : true
  loss_type : mix2  

  load :
    inherit : True
    model : model_current.pth

  optim:
    type : AdamW 
    init_lr : !!float 1e-4
    weight_decay : !!float 1e-3
    final_lr : !!float 1e-5
    betas : [0.9,0.95]
    scheduler_type : linear #cosine

save:
  freq : 1322
  auto_freq : 1322

val:
  freq : 1322